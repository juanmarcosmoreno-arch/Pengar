# Compila la app de iPhone para el simulador, sin firmar, con Xcode 26 (README → «Compilación automática»).
# Es lo que verifica el código Swift (los plugins propios y los de Capacitor) sin una Mac a mano. Lo de src/ no cambia
# la compilación de Swift (public/ se copia tal cual) y ya lo prueba ci.yml: no la dispara. Para una corrida completa,
# Run workflow (workflow_dispatch)
name: iOS

on:
  push:
    # Solo ramas: los path filters no se miran en los tags (cada tag la dispararía)
    branches: ['**']
    paths:
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'
  # Los de un fork no tienen push en este repositorio (los de una rama de acá ya corren por el push: ver el if del job)
  pull_request:
    paths:
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Compilar para el simulador (Xcode 26)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # La imagen con Xcode 26: Capacitor 8 y Foundation Models (Apple Intelligence) piden el SDK de iOS 26
    runs-on: macos-26
    timeout-minutes: 45
    env:
      NSUnbufferedIO: 'YES'
      LOG: build/xcodebuild.log
    steps:
      - uses: actions/checkout@v5

      - name: Xcode y SDK de iOS
        run: |
          sdk() { xcrun --sdk iphonesimulator --show-sdk-version; }
          # Si el Xcode de fábrica no trae el SDK de iOS 26, se prueba con un Xcode 26 instalado al lado
          if [ "$(sdk | cut -d. -f1)" -lt 26 ]; then
            XCODE=""
            for x in /Applications/Xcode_26*.app; do if [ -d "$x" ]; then XCODE="$x"; fi; done
            if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE/Contents/Developer"; fi
          fi
          xcodebuild -version
          xcodebuild -showsdks | grep -i -E "ios|simulator" || true
          SDK=$(sdk)
          echo "SDK del simulador: $SDK"
          if [ "$(echo "$SDK" | cut -d. -f1)" -lt 26 ]; then
            echo "::error::Hace falta el SDK de iOS 26 (Xcode 26) y este runner tiene el $SDK"
            exit 1
          fi
          {
            echo '### Xcode'
            echo '```'
            xcodebuild -version
            echo "SDK del simulador: $SDK"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Build de la web
        run: npm run build

      - name: Pasar la web y los plugins al proyecto de iOS
        run: npx cap sync ios

      - name: Paquetes de Swift
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -clonedSourcePackagesDirPath build/SourcePackages

      - name: Compilar
        id: build
        run: |
          set -o pipefail
          mkdir -p build
          # Con el destino genérico no hay arquitectura activa y se compilarían las dos (arm64 y x86_64): el runner y
          # el simulador de hoy son arm64 (el xcframework de Capacitor trae ese slice), así que alcanza con una (ARCHS)
          # xcbeautify deja el log legible y marca cada error en el resumen del job; si no está, va el log tal cual
          command -v xcbeautify >/dev/null || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcbeautify || true
          HELP=$(xcbeautify --help 2>&1 || true)
          if [[ "$HELP" == *github-actions* ]]; then
            BEAUTIFY=(xcbeautify --renderer github-actions)
          else
            BEAUTIFY=(cat)
          fi
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/App.xcresult \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee "$LOG" | "${BEAUTIFY[@]}"

      - name: Resumen
        if: always() && steps.build.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.build.outcome }}
        run: |
          # Cancelada (una corrida más nueva de la misma rama, o se acabó el tiempo): ni «No compiló» ni el artifact
          if [ "$OUTCOME" = "cancelled" ]; then
            echo '### Cancelada (una corrida más nueva, o se acabó el tiempo)' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          [ -f "$LOG" ] || exit 0
          # Rutas cortas (sin la carpeta del runner) y sin repetidos (el mismo error puede salir más de una vez)
          short() { sed "s|$GITHUB_WORKSPACE/||g" | sort -u; }
          if [ "$OUTCOME" = "success" ]; then
            echo '### Compiló para el simulador' >> "$GITHUB_STEP_SUMMARY"
            WARNINGS=$(grep -E 'ios/App/App/[^/ ]+\.swift:[0-9]+:[0-9]+: warning:' "$LOG" | short || true)
            if [ -n "$WARNINGS" ]; then
              { echo 'Avisos del compilador en el código propio:'; echo '```'; echo "$WARNINGS"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          ERRORS=$(grep -E '(^|[^[:alnum:]_])error:' "$LOG" | short | head -n 100 || true)
          FAILED=$(sed -n '/The following build commands failed:/,/^$/p' "$LOG" | sed "s|$GITHUB_WORKSPACE/||g" | head -n 40 || true)
          {
            echo '### No compiló'
            echo '```'
            echo "${ERRORS:-(sin líneas con «error:»; mirá el log completo)}"
            echo '```'
            if [ -n "$FAILED" ]; then echo '```'; echo "$FAILED"; echo '```'; fi
            echo 'El log completo y el .xcresult quedan en el artifact «ios-build-log».'
          } >> "$GITHUB_STEP_SUMMARY"
          # También al final de la consola, para no tener que buscarlos en el log
          echo '---- Errores ----'
          echo "${ERRORS:-(sin líneas con «error:»)}"
          if [ -n "$FAILED" ]; then echo "$FAILED"; fi

      - name: Subir el log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-log
          path: |
            build/xcodebuild.log
            build/App.xcresult
          if-no-files-found: ignore
          retention-days: 14
